<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>侧边栏索引生成器</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, 'Microsoft YaHei', sans-serif;
    background: #f5f7fa; color: #333; min-height: 100vh;
  }
  .header {
    background: linear-gradient(135deg, #2096ff, #0066cc);
    color: #fff; padding: 24px; text-align: center;
  }
  .header h1 { font-size: 22px; font-weight: 600; }
  .header p { font-size: 13px; opacity: 0.85; margin-top: 4px; }

  .container { max-width: 900px; margin: 0 auto; padding: 20px; }

  .drop-zone {
    border: 2px dashed #ccc; border-radius: 12px; padding: 48px 20px;
    text-align: center; cursor: pointer; transition: all .2s;
    background: #fff; margin-bottom: 16px;
  }
  .drop-zone:hover, .drop-zone.drag-over {
    border-color: #2096ff; background: #eef6ff;
  }
  .drop-zone .icon { font-size: 42px; margin-bottom: 8px; }
  .drop-zone .text { font-size: 15px; color: #666; }
  .drop-zone .hint { font-size: 12px; color: #999; margin-top: 4px; }

  .config { background: #fff; border-radius: 10px; padding: 16px 20px; margin-bottom: 16px; }
  .config h3 { font-size: 15px; margin-bottom: 10px; color: #555; }
  .config-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .config-row label { font-size: 13px; color: #888; white-space: nowrap; }
  .config-row input { padding: 6px 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; width: 100px; }
  .config-row select { padding: 6px 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; }

  .status { font-size: 13px; color: #888; margin-bottom: 8px; text-align: center; }

  .output-area { display: none; background: #fff; border-radius: 10px; overflow: hidden; }
  .output-area.show { display: block; }
  .output-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 16px; background: #f8f9fb; border-bottom: 1px solid #eee;
  }
  .output-header h3 { font-size: 14px; color: #555; }
  .btn-group { display: flex; gap: 8px; }

  .btn {
    padding: 8px 18px; border: none; border-radius: 6px; font-size: 13px;
    cursor: pointer; transition: all .15s; font-weight: 500;
  }
  .btn-primary { background: #2096ff; color: #fff; }
  .btn-primary:hover { background: #1a85e8; }
  .btn-outline { background: #fff; color: #2096ff; border: 1px solid #2096ff; }
  .btn-outline:hover { background: #eef6ff; }
  .btn-green { background: #52c41a; color: #fff; }
  .btn-green:hover { background: #49b018; }

  pre { padding: 16px; overflow-x: auto; font-size: 13px; line-height: 1.7; max-height: 60vh; white-space: pre-wrap; word-break: break-all; }
  .toast { position: fixed; top: 20px; right: 20px; padding: 10px 20px; border-radius: 8px; color: #fff; font-size: 13px; z-index: 999; transition: .3s; opacity: 0; }
  .toast.show { opacity: 1; }
  .toast.success { background: #52c41a; }
  .toast.error { background: #ff4d4f; }
</style>
</head>
<body>
<div class="header">
  <h1>📋 侧边栏索引生成器</h1>
  <p>拖入 md 文件夹快速生成 _sidebar.md</p>
</div>

<div class="container">
  <div class="drop-zone" id="dropZone">
    <div class="icon">📁</div>
    <div class="text">拖拽 md 文件夹到此处</div>
    <div class="hint">或点击选择文件夹（需 Chrome/Edge 浏览器）</div>
  </div>

  <div class="config">
    <h3>⚙️ 生成选项</h3>
    <div class="config-row">
      <label>分类图标:</label>
      <input type="text" id="catIcon" value="📁" style="width:60px;">
      <label>文件图标:</label>
      <input type="text" id="fileIcon" value="📄" style="width:60px;">
      <label>首页显示:</label>
      <input type="text" id="homeLabel" value=":octocat: 首页" style="width:130px;">
      <label>搜索显示:</label>
      <input type="text" id="searchLabel" value="🔍 全站搜索" style="width:120px;">
    </div>
  </div>

  <div class="status" id="status">等待选择文件夹...</div>

  <div class="output-area" id="outputArea">
    <div class="output-header">
      <h3>📝 生成内容预览</h3>
      <div class="btn-group">
        <button class="btn btn-green" onclick="copyOutput()">📋 复制</button>
        <button class="btn btn-outline" onclick="downloadOutput()">💾 下载</button>
      </div>
    </div>
    <pre id="output"></pre>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const dropZone = document.getElementById('dropZone');
  const outputArea = document.getElementById('outputArea');
  const output = document.getElementById('output');
  const status = document.getElementById('status');
  const toast = document.getElementById('toast');

  // Config elements
  const catIconEl = document.getElementById('catIcon');
  const fileIconEl = document.getElementById('fileIcon');
  const homeLabelEl = document.getElementById('homeLabel');
  const searchLabelEl = document.getElementById('searchLabel');

  // Click to select folder
  dropZone.addEventListener('click', () => {
    const input = document.createElement('input');
    input.type = 'file';
    input.webkitdirectory = true;
    input.directory = true;
    input.onchange = (e) => handleFiles(e.target.files);
    input.click();
  });

  // Drag events
  dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('drag-over'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
  dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropZone.classList.remove('drag-over');
    const items = e.dataTransfer.items;
    if (items && items.length > 0) {
      const entry = items[0].webkitGetAsEntry();
      if (entry && entry.isDirectory) {
        scanDirectory(entry);
      } else {
        showStatus('请拖入一个文件夹（md 目录）', 'error');
      }
    }
  });

  function handleFiles(files) {
    if (!files || files.length === 0) return;
    const entries = {};
    for (const file of files) {
      const rel = file.webkitRelativePath || file.name;
      entries[rel] = file.name;
    }
    const tree = buildTree(stripRoot(entries));
    generateSidebar(tree);
  }

  // 去除所有路径的共同根目录前缀（如 md/）
  function stripRoot(entries) {
    const paths = Object.keys(entries);
    if (paths.length === 0) return entries;
    // 找到共同前缀段数
    const parts = paths.map(p => p.split('/'));
    let common = 0;
    if (parts.length > 1) {
      const first = parts[0];
      for (let i = 0; i < first.length - 1; i++) {
        if (parts.every(p => p[i] === first[i])) common = i + 1;
        else break;
      }
    }
    if (common === 0) return entries;
    const stripped = {};
    for (const [path, name] of Object.entries(entries)) {
      const newPath = path.split('/').slice(common).join('/');
      stripped[newPath] = name;
    }
    return stripped;
  }

  // URL编码路径，但保留 / 分隔符
  function encodePath(path) {
    return path.split('/').map(encodeURIComponent).join('/');
  }

  async function scanDirectory(dirEntry) {
    showStatus('正在扫描文件夹...');
    const result = {};
    async function readDir(entry, prefix) {
      const reader = entry.createReader();
      const readAll = () => new Promise((resolve) => {
        const all = [];
        const getBatch = () => {
          reader.readEntries((batch) => {
            if (batch.length === 0) { resolve(all); return; }
            all.push(...batch);
            getBatch();
          });
        };
        getBatch();
      });
      const batch = await readAll();
      for (const e of batch) {
        const path = prefix + e.name;
        if (e.isFile && e.name.endsWith('.md')) {
          result[path] = e.name;
        } else if (e.isDirectory) {
          await readDir(e, path + '/');
        }
      }
    }
    await readDir(dirEntry, '');
    const tree = buildTree(result);
    generateSidebar(tree);
  }

  function buildTree(entries) {
    const tree = {};
    for (const [path, name] of Object.entries(entries)) {
      const parts = path.split('/');
      if (parts.length < 2) continue;
      const dir = parts[0];
      if (!tree[dir]) tree[dir] = [];
      if (parts.length === 2) {
        tree[dir].push(name);
      } else {
        // Handle nested files (depth > 1)
        tree[dir].push(parts.slice(1).join('/'));
      }
    }
    // Sort dirs
    const sorted = {};
    Object.keys(tree).sort().forEach(k => { sorted[k] = tree[k].sort(); });
    return sorted;
  }

  function generateSidebar(tree) {
    const catIcon = catIconEl.value;
    const fileIcon = fileIconEl.value;
    const homeLabel = homeLabelEl.value;
    const searchLabel = searchLabelEl.value;

    let lines = [];
    lines.push(`-  [${homeLabel}](/README.md)`);
    lines.push(`-  [${searchLabel}](/md/search.md)`);
    lines.push(`-  📁 项目目录`);

    for (const [dir, files] of Object.entries(tree)) {
      // 侧边栏分类页不编码（与现有 _sidebar.md 保持一致）
      lines.push(`  - [${catIcon} ${dir}](/sidebar/${dir}.md)`);
      for (const file of files) {
        const displayName = file.replace(/\.md$/, '');
        lines.push(`      - [${fileIcon} ${displayName}](/md/${dir}/${file})`);
      }
    }

    const content = lines.join('\n');
    output.textContent = content;
    outputArea.classList.add('show');
    const count = Object.keys(tree).length;
    const totalFiles = Object.values(tree).reduce((s, f) => s + f.length, 0);
    showStatus(`已生成 ${count} 个分类，共 ${totalFiles} 个文档`);
  }

  function showStatus(msg, type) {
    status.textContent = msg;
    if (type === 'error') status.style.color = '#ff4d4f';
    else status.style.color = '#888';
    // Also show toast
    toast.textContent = msg;
    toast.className = 'toast ' + (type === 'error' ? 'error' : 'success') + ' show';
    setTimeout(() => { toast.classList.remove('show'); }, 2000);
  }

  function copyOutput() {
    const text = output.textContent;
    if (!text) return;
    navigator.clipboard.writeText(text).then(() => {
      showStatus('已复制到剪贴板！', 'success');
    }).catch(() => {
      // Fallback
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showStatus('已复制到剪贴板！', 'success');
    });
  }

  function downloadOutput() {
    const text = output.textContent;
    if (!text) return;
    const blob = new Blob([text], {type: 'text/markdown'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = '_sidebar.md';
    a.click();
    URL.revokeObjectURL(url);
    showStatus('已下载 _sidebar.md', 'success');
  }
</script>
</body>
</html>
